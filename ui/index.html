<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipHistory · 面板样式 demo</title>
<link rel="stylesheet" href="./vendor/arco.css">
<style>
  /* 性能取舍：面板内不使用任何过渡/动画，交互即时生效；列表行 contain 隔离重绘 */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--color-bg-1);
    color: var(--color-text-1);
    -webkit-font-smoothing: antialiased;
    color-scheme: light;
  }
  [v-cloak] { display: none; }

  .demo-shell {
    min-height: 100vh; padding: 32px 20px 40px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  .demo-bar { width: 720px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .demo-title { font-size: 14px; font-weight: 600; }
  .demo-title span { margin-left: 8px; font-size: 12px; font-weight: 400; color: var(--color-text-3); }
  .demo-actions { display: flex; align-items: center; gap: 8px; }

  .clip-panel {
    width: 720px; height: 520px;
    display: flex; flex-direction: column;
    background: var(--color-bg-2);
    border: 1px solid var(--color-border-2);
    border-radius: 12px;
    overflow: hidden;
  }
  .clip-panel *, .clip-panel *::before, .clip-panel *::after {
    transition: none !important;
    animation: none !important;
  }

  .panel-head { flex: none; padding: 12px; border-bottom: 1px solid var(--color-border-1); }
  .panel-head .arco-input-wrapper { border-radius: 8px; }

  .panel-body {
    flex: 1; min-height: 0; padding: 6px 8px;
    overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin;
  }
  .panel-body::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--color-fill-3); border-radius: 4px; }

  .clip-list { margin: 0; padding: 0; list-style: none; }
  .clip-row {
    padding: 8px 12px;
    border-radius: 8px;
    contain: content;
    cursor: default;
  }
  .clip-row:hover { background: var(--color-fill-2); }
  .clip-row.selected { background: rgb(var(--primary-1)); }
  .clip-row.selected:hover { background: rgb(var(--primary-1)); }

  .row-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row-src {
    font-size: 11px; line-height: 16px; letter-spacing: .02em;
    color: var(--color-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-time {
    font-size: 11px; line-height: 16px; color: var(--color-text-3);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .row-body {
    margin-top: 2px; font-size: 13px; line-height: 20px; color: var(--color-text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .clip-row.selected .row-body {
    white-space: pre-wrap; overflow-wrap: anywhere;
    overflow: visible; text-overflow: clip;
  }
  mark {
    padding: 0 1px; border-radius: 2px; color: inherit;
    background: color-mix(in srgb, rgb(var(--primary-6)) 22%, transparent);
  }

  .empty-wrap { height: 100%; display: flex; align-items: center; justify-content: center; }

  .panel-foot {
    flex: none; height: 32px; padding: 0 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border-top: 1px solid var(--color-border-1);
    font-size: 12px; color: var(--color-text-3);
  }
  .hints { display: flex; align-items: center; gap: 6px; }
  kbd {
    flex: none;
    min-width: 24px;
    padding: 0 5px; border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 11px; line-height: 16px;
    background: var(--color-fill-2); color: var(--color-text-2);
  }
  .hints .sep { color: var(--color-text-4); }

  .demo-status {
    width: 720px; min-height: 18px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: var(--color-text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
<div id="app" v-cloak>
  <div class="demo-shell">
    <div class="demo-bar">
      <div class="demo-title">ClipHistory<span>Arco Design Vue · 720 × 520 · 无动效</span></div>
      <div class="demo-actions">
        <a-button size="small" @click="resetData">重置数据</a-button>
      </div>
    </div>

    <section class="clip-panel" aria-label="剪贴板历史" @keydown="onKeydown" @click="focusSearch">
      <div class="panel-head">
        <a-input
          ref="searchEl"
          v-model="keyword"
          size="large"
          allow-clear
          placeholder="搜索剪贴板历史"
        >
          <template #prefix>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.4"></circle>
              <path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
            </svg>
          </template>
        </a-input>
      </div>

      <div class="panel-body">
        <ul v-if="filtered.length" class="clip-list" role="listbox" aria-label="剪贴板记录">
          <li
            v-for="item in filtered"
            :key="item.id"
            class="clip-row"
            :class="{ selected: item.id === selectedId }"
            role="option"
            :aria-selected="item.id === selectedId"
            @mousedown.prevent
            @click="select(item)"
            @dblclick="paste(item)"
          >
            <div class="row-meta">
              <span class="row-src">{{ item.src }}</span>
              <span class="row-time">{{ relTime(item.ts) + '\u00A0\u00A0' + fmtTime(item.ts) }}</span>
            </div>
            <div class="row-body">
              <template v-for="(seg, i) in highlight(item.body)" :key="i">
                <mark v-if="seg.hit">{{ seg.t }}</mark>
                <template v-else>{{ seg.t }}</template>
              </template>
            </div>
          </li>
        </ul>
        <div v-else class="empty-wrap">
          <a-empty :description="emptyText"></a-empty>
        </div>
      </div>

      <div class="panel-foot">
        <span v-if="total > 200">已显示前 200 / {{ total }} 条</span>
        <span v-else-if="filtered.length !== total">{{ filtered.length }} / {{ total }} 条</span>
        <span v-else>{{ total }} 条</span>
        <span class="hints">
          <kbd>↑↓</kbd>选择<span class="sep">·</span>
          <kbd>Enter/双击</kbd>粘贴<span class="sep">·</span>
          <kbd>⌘C</kbd>复制<span class="sep">·</span>
          <kbd>⌘⌫</kbd>删除<span class="sep">·</span>
          <kbd>Esc</kbd>关闭
        </span>
      </div>
    </section>

    <div class="demo-status" aria-live="polite">{{ event }}</div>
  </div>
</div>

<script src="./vendor/vue.global.prod.js"></script>
<script src="./vendor/arco-vue.min.js"></script>
<script>
  const { createApp, ref, computed, watch, nextTick, onMounted, onBeforeUnmount } = Vue;

  const SEED = [
    { src: 'Safari',   minutes: 0,     body: 'https://arco.design/vue/docs/start' },
    { src: 'VS Code',  minutes: 2,     body: 'hs.webview.new({ x = 120, y = 96, w = 720, h = 520 })' },
    { src: '飞书',      minutes: 5,     body: '周会结论：剪贴板历史先做纯文本，不做富文本和图片；搜索走 LIKE 加结果上限，数据量上来再考虑 FTS5。' },
    { src: 'Terminal', minutes: 18,    body: 'npm run build && rsync -av dist/ ~/Sites/clip/' },
    { src: 'Notion',   minutes: 42,    body: 'Q4 目标：把面板唤出到可输入的延迟压到 100ms 以内，搜索首屏不超过 50ms。' },
    { src: '微信',      minutes: 60,    body: '明天下午三点前把接口文档补完，辛苦。' },
    { src: 'Xcode',    minutes: 120,   body: '2026-11-10 15:09:22.871 ClipHistory[4821:99123] watcher started, db ok' },
    { src: 'Finder',   minutes: 180,   body: '/Users/felixfung/Desktop/论文' },
    { src: '未知',      minutes: 300,   body: 'felix@example.com' },
    { src: 'Safari',   minutes: 1440,  body: 'A clipboard manager should feel like an extension of the keyboard: open, type two letters, hit Enter, gone.' },
    { src: 'VS Code',  minutes: 1500,  body: 'git rebase --interactive HEAD~3' },
    { src: '备忘录',    minutes: 2880,  body: '待办：1. 改 spec 2. 接 hs.sqlite3 3. 做粘贴时序 4. 写 README' },
    { src: 'Chrome',   minutes: 4320,  body: '“Simplicity is prerequisite for reliability.” — Edsger W. Dijkstra' },
    { src: '未知',      minutes: 5760,  body: '{ "name": "cliphistory", "version": "1.0.0", "private": true }' }
  ];

  let seq = 0;
  const seed = () => SEED.map(it => ({
    id: ++seq,
    src: it.src,
    ts: Date.now() - it.minutes * 60000,
    body: it.body,
    lower: it.body.toLowerCase()
  }));

  createApp({
    setup() {
      const items = ref(seed());
      const keyword = ref('');
      const query = ref('');
      const selectedId = ref(null);
      const event = ref('面板就绪 · 输入即搜，Enter 粘贴');
      const searchEl = ref(null);

      let debounceTimer = null;
      watch(keyword, val => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => { query.value = val.trim().toLowerCase(); }, 100);
      });

      const kws = computed(() => query.value ? query.value.split(/\s+/).filter(Boolean) : []);
      const hlRe = computed(() => {
        if (!kws.value.length) return null;
        const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return new RegExp('(' + kws.value.map(esc).join('|') + ')', 'gi');
      });
      const total = computed(() => items.value.length);
      const filtered = computed(() => {
        const ks = kws.value;
        const list = ks.length
          ? items.value.filter(it => ks.every(k => it.lower.includes(k)))
          : items.value;
        return list.slice(0, 200);
      });
      const selectedItem = computed(() => items.value.find(it => it.id === selectedId.value) || null);
      const emptyText = computed(() => items.value.length ? '没有匹配的记录' : '还没有剪贴板记录');
      watch(filtered, list => {
        if (selectedId.value && !list.some(it => it.id === selectedId.value)) selectedId.value = null;
      });

      function relTime(ts) {
        const d = Date.now() - ts;
        if (d < 60000) return '刚刚';
        if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
        if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
        return Math.floor(d / 86400000) + ' 天前';
      }

      function fmtTime(ts) {
        const d = new Date(ts);
        const p = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      }

      function highlight(text) {
        const re = hlRe.value;
        if (!re) return [{ t: text, hit: false }];
        return text.split(re).filter(Boolean).map(p => ({ t: p, hit: kws.value.includes(p.toLowerCase()) }));
      }

      function select(item) {
        selectedId.value = item.id;
      }

      function move(step) {
        if (!filtered.value.length) return;
        const i = filtered.value.findIndex(it => it.id === selectedId.value);
        const next = i === -1
          ? (step > 0 ? 0 : filtered.value.length - 1)
          : Math.min(filtered.value.length - 1, Math.max(0, i + step));
        selectedId.value = filtered.value[next].id;
        nextTick(() => {
          const body = document.querySelector('.panel-body');
          const el = document.querySelector('.clip-row.selected');
          if (!body || !el) return;
          const top = el.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop;
          const bottom = top + el.offsetHeight;
          if (bottom > body.scrollTop + body.clientHeight) body.scrollTop = bottom - body.clientHeight;
          else if (top < body.scrollTop) body.scrollTop = top;
        });
      }

      const brief = s => s.length > 42 ? s.slice(0, 42) + '…' : s;

      function paste(item) {
        event.value = '粘贴 → Safari：' + brief(item.body) + '（真实行为：关闭面板并模拟 ⌘V）';
      }

      function copySelected() {
        const it = selectedItem.value;
        if (!it) return;
        event.value = '⌘C 只复制：已写回剪贴板，不发送 ⌘V（真实行为：关闭面板）';
      }

      function deleteSelected() {
        const it = selectedItem.value;
        if (!it) return;
        const i = items.value.findIndex(x => x.id === it.id);
        items.value.splice(i, 1);
        const next = filtered.value[Math.min(i, filtered.value.length - 1)];
        selectedId.value = next ? next.id : null;
        event.value = '⌘⌫ 删除：' + brief(it.body);
      }

      function resetData() {
        items.value = seed();
        selectedId.value = null;
        event.value = '已重置为 demo 数据';
      }

      function onKeydown(e) {
        const mod = e.metaKey;
        if (mod && e.key === 'Backspace') {
          e.preventDefault();
          if (!e.shiftKey) deleteSelected();
          return;
        }
        if (mod && (e.key === 'c' || e.key === 'C')) {
          if (selectedItem.value) { e.preventDefault(); copySelected(); }
          return;
        }
        if (e.key === 'ArrowDown') { e.preventDefault(); move(1); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); return; }
        if (e.key === 'Enter') {
          if (selectedItem.value) { e.preventDefault(); paste(selectedItem.value); }
          return;
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          event.value = 'Esc · 关闭面板（demo 中不关闭）';
        }
      }

      function focusSearch() {
        nextTick(() => { if (searchEl.value) searchEl.value.focus(); });
      }

      function onDocKeydown(e) {
        if (e.defaultPrevented) return;
        if (e.target && e.target.closest && e.target.closest('.demo-actions')) return;
        onKeydown(e);
      }

      focusSearch();
      onMounted(() => document.addEventListener('keydown', onDocKeydown));

      onBeforeUnmount(() => {
        document.removeEventListener('keydown', onDocKeydown);
        clearTimeout(debounceTimer);
      });

      return {
        items, keyword, selectedId, event, searchEl,
        filtered, total, selectedItem, emptyText,
        relTime, fmtTime, highlight, select, paste, copySelected, deleteSelected,
        resetData, onKeydown, focusSearch
      };
    }
  }).use(ArcoVue).mount('#app');
</script>
</body>
</html>
